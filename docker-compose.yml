services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: juego-de-lenguajes-backend
    restart: unless-stopped
    ports:
      - "8765:8765"
      - "8766:8766"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8766/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
